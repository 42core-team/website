image:
  repository: github-service
  tag: local
  pullPolicy: IfNotPresent

fullnameOverride: "github-service"

serviceAccount:
  create: false

env:
  # Repositories named sim-* are simulated, only in development.
  NODE_ENV: development

secrets:
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  API_SECRET_ENCRYPTION_KEY: secret-encryption-key
  # Injected via --set from .env.tilt
  GITHUB_APP_PRIVATE_KEY: ""

resources:
  limits:
    cpu: 8
    memory: 4Gi
  requests:
    cpu: 1
    memory: 1Gi

startupProbe:
  enabled: false

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false
