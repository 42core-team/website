replicaCount: 1

# Roll out one pod at a time: start one new pod, wait until it has been Ready
# for minReadySeconds, then terminate one old pod. Never drop below the desired count.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 5
terminationGracePeriodSeconds: 30

# Keep serving for a few seconds after termination starts so the endpoint is
# removed from Services/ingress before the process receives SIGTERM.
lifecycle:
  preStop:
    sleep:
      seconds: 5

image:
  repository: ghcr.io/OWNER/REPO-k8s-service
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 9000

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

# Non-sensitive environment variables
env:
  ADDR: ":9000"
  NAMESPACE: "coregame"
  S3_ENDPOINT: "https://s3.example"
  S3_REGION: "eu"
  S3_BUCKET: "core-replays"

# Probes (both check the RabbitMQ channel; the service has no reconnect logic,
# so a liveness restart is how it recovers from a lost connection)
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# Sensitive values are passed as Kubernetes Secret
secrets:
  RABBITMQ: ""
  RABBITMQ_HTTP: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
