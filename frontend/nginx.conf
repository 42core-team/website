server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /readyz {
    access_log off;
    default_type text/html;
    try_files /index.html =503;
  }

  location / {
    # Revalidate the app shell so a browser never keeps pointing at old assets.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
