server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri @assets_archive;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Hashed assets from earlier releases live in object storage, so tabs still
  # running an older index.html can load their chunks after a rollout.
  # The proxy settings are generated at startup by assets-archive.sh.
  location @assets_archive {
    include /etc/nginx/assets-archive.conf;

    proxy_intercept_errors on;
    error_page 403 404 = @asset_missing;

    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Private buckets answer 403 for missing keys; report both as a plain 404.
  location @asset_missing {
    return 404;
  }
}
