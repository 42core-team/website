# Default values for frontend
replicaCount: 1

# Roll out one pod at a time: start one new pod, wait until it has been Ready
# for minReadySeconds, then terminate one old pod. Never drop below the desired count.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 5
terminationGracePeriodSeconds: 30

# Keep serving for a few seconds after termination starts so the endpoint is
# removed from Services/ingress before the process receives SIGTERM.
lifecycle:
  preStop:
    sleep:
      seconds: 5

image:
  repository: ghcr.io/42core-team/website_relaunch-frontend
  pullPolicy: IfNotPresent
  tag: latest

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: production
  # 42 OAuth Client ID - public variable
  VITE_FORTY_TWO_CLIENT_ID: ""
  # Add other environment variables as needed
  VITE_VISUALIZER_URL: ""
  VITE_BACKEND_PUBLIC_URL: ""
  VITE_S3_REPLAYS_BUCKET_URL: ""
  # Also required at image build time; runtime env cannot change the static bundle.
  VITE_MEDIA_URL: ""
  AUTH_COOKIE_NAME: "token"

# Secrets - these should be provided via GitHub secrets during deployment
secrets:
  VITE_AUTH_SECRET: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Redirect ingress for handling domain redirects (e.g., www to apex domain)
ingressRedirect:
  enabled: false
  className: ""
  annotations: {}
  # Source host to redirect from (e.g., www.example.com)
  fromHost: ""
  # Destination host to redirect to (e.g., example.com)
  toHost: ""
  # HTTP status code for redirect (default: 308 permanent redirect)
  code: "308"
  tls:
    enabled: false
    secretName: ""

# Probes
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
