# Production environment values
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV: production
  # NextAuth Configuration
  VITE_AUTH_URL: "https://coregame.sh"
  # GitHub OAuth Configuration
  CLIENT_ID_GITHUB: prod-github-client-id
  # 42 OAuth Configuration - public variable
  VITE_FORTY_TWO_CLIENT_ID: prod-42-client-id
  # Backend API Configuration
  BACKEND_URL: "http://api-main"
  VITE_VISUALIZER_URL: "https://visualizer.coregame.sh"
  VITE_BACKEND_PUBLIC_URL: "https://api.coregame.sh"
  VITE_S3_REPLAYS_BUCKET_URL: "https://s3.coregame.sh/core-replays"
  AUTH_COOKIE_NAME: "token"

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: coregame.sh
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - coregame.sh
      secretName: coregame-de-tls

ingressRedirect:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  fromHost: www.coregame.sh
  toHost: coregame.sh
  tls:
    enabled: true
    secretName: www-coregame-de-tls

nodeSelector: {}
tolerations: []
affinity: {}
