apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend.fullname" . }}-secrets
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
data:
  # These will be populated from GitHub secrets during deployment
  VITE_AUTH_SECRET: {{ .Values.secrets.VITE_AUTH_SECRET | b64enc | quote }}
  VITE_SERVER_ACTIONS_ENCRYPTION_KEY: {{ .Values.secrets.VITE_SERVER_ACTIONS_ENCRYPTION_KEY | b64enc | quote }}
