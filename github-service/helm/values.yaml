replicaCount: 1

# Roll out one pod at a time: start one new pod, wait until it has been Ready
# for minReadySeconds, then terminate one old pod. Never drop below the desired count.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 5
terminationGracePeriodSeconds: 30

image:
  repository: ghcr.io/OWNER/REPO-github-service
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

# Optional non-sensitive environment variables
env: {}

# Sensitive values are passed as Kubernetes Secret
secrets:
  RABBITMQ_URL: ""
  API_SECRET_ENCRYPTION_KEY: ""

# HTTP port, only used for health probes
port: 3000

# Probes (readiness also checks the RabbitMQ connection)
startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 30

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
