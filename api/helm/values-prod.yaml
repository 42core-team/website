# Production environment values
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV: production
  RABBITMQ_QUEUE_PREFIX: ""
  # Database configuration
  DB_TYPE: postgres
  DB_PORT: "5432"
  DB_HOST: ""
  DB_USER: ""
  DB_NAME: ""
  DB_SCHEMA: ""
  K8S_SERVICE_URL: ""
  API_BASE_URL: "https://api.coregame.sh"
  # CORS configuration for prod
  CORS_ORIGIN: "https://coregame.sh"
  AUTH_COOKIE_NAME: "token"
  AUTH_COOKIE_DOMAIN: ".coregame.sh"

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: api.coregame.sh
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.coregame.sh
      secretName: api-coregame-de-tls

nodeSelector: {}
tolerations: []
affinity: {}
