# Default values for api
replicaCount: 1

# Roll out one pod at a time: start one new pod, wait until it has been Ready
# for minReadySeconds, then terminate one old pod. Never drop below the desired count.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 5
terminationGracePeriodSeconds: 30

# Keep serving for a few seconds after termination starts so the endpoint is
# removed from Services/ingress before the process receives SIGTERM.
lifecycle:
  preStop:
    sleep:
      seconds: 5

image:
  repository: ghcr.io/42core-team/website_relaunch-api
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: production
  PORT: "80"
  # Database configuration
  DB_TYPE: postgres
  DB_PORT: "5432"
  DB_HOST: ""
  DB_USER: ""
  DB_NAME: ""
  DB_SCHEMA: ""
  K8S_SERVICE_URL: ""
  API_BASE_URL: ""
  DB_SSL_REQUIRED: "true"
  AUTH_COOKIE_NAME: "token"
  AUTH_COOKIE_DOMAIN: ".coregame.sh"
  # Dedicated storage for team artwork; supplied by deployment variables.
  MEDIA_S3_ENDPOINT: ""
  MEDIA_S3_BUCKET: ""
  MEDIA_S3_REGION: "eu01"

# These are placeholders.
# Values are injected at runtime via --set flags in the CI/CD pipeline.
secrets:
  DB_PASSWORD: ""
  DB_URL: ""
  API_SECRET_ENCRYPTION_KEY: ""
  RABBITMQ_URL: ""
  JWT_SECRET: ""
  CLIENT_GITHUB_SECRET: ""
  FORTYTWO_CLIENT_SECRET: ""
  MEDIA_S3_ACCESS_KEY_ID: ""
  MEDIA_S3_SECRET_ACCESS_KEY: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Probes
# startup/liveness only check the process; readiness also checks the database.
# Generous budget: the container runs database migrations before it starts listening.
startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 60

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
