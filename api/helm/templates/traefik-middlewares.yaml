{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "api.traefikName" (dict "root" . "suffix" "cors") }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  headers:
    accessControlAllowCredentials: true
    accessControlAllowOriginList:
      - {{ .Values.env.CORS_ORIGIN | quote }}
    # Keep credentialed requests limited to the configured website origin.
    accessControlAllowMethods: [GET, PUT, POST, DELETE, PATCH, OPTIONS]
    accessControlAllowHeaders: [DNT, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization]
    accessControlMaxAge: 1728000
    addVaryHeader: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "api.traefikName" (dict "root" . "suffix" "upload-limit") }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.ingress.maxRequestBodyBytes | int }}
{{- end }}
