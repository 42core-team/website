{{- if and .Values.ingress.enabled .Values.ingress.traefik.preview }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "api.traefikName" (dict "root" . "suffix" "traefik-preview") }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    {{- include "api.traefikAnnotations" (dict "root" . "preview" true) | nindent 4 }}
spec:
  ingressClassName: traefik
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "api.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
